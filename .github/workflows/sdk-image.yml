name: Build & Publish Jaguar SDK image

on:
  push:
    branches: ['**']
    paths:
      - 'docker/**'
      - '.github/workflows/sdk-image.yml'
  pull_request:
    paths:
      - 'docker/**'
      - '.github/workflows/sdk-image.yml'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push the built image to GHCR'
        required: false
        default: 'true'

concurrency:
  group: sdk-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/jaguar-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image name
        id: img
        run: echo "image=$(echo ${IMAGE} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${{ steps.img.outputs.image }}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${{ steps.img.outputs.image }}:latest"
            echo "${{ steps.img.outputs.image }}:sha-${SHORT_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Resolve push-vs-load-vs-neither once so the build and smoke-test
      # steps stay in sync. PRs do nothing remote (no creds). Pushes go to
      # GHCR. Manual dispatch with push=false loads into the local daemon
      # so the smoke-test can exercise the image we *just* built rather
      # than pulling whatever happens to be tagged :latest in the registry.
      - name: Resolve build mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "load=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.inputs.push }}" = 'false' ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "load=true"  >> "$GITHUB_OUTPUT"
          else
            echo "push=true"  >> "$GITHUB_OUTPUT"
            echo "load=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build${{ steps.mode.outputs.push == 'true' && ' & push' || '' }} SDK image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          platforms: linux/amd64
          push: ${{ steps.mode.outputs.push == 'true' }}
          load: ${{ steps.mode.outputs.load == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Set the OCI source label to the *fork's* repo URL so GHCR
          # auto-links the package to this repository (otherwise it would
          # point at whatever Dockerfile baked in).
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}

      - name: Smoke-test the image
        if: github.event_name != 'pull_request'
        run: |
          # If we pushed, pull the immutable :sha-<short> tag back so we test
          # the exact bytes that just landed. If we only built locally
          # (workflow_dispatch with push=false + load=true), the image is
          # already in the daemon under both tags.
          if [ "${{ steps.mode.outputs.push }}" = 'true' ]; then
            docker pull "${{ steps.tags.outputs.sha_tag }}"
          fi
          docker run --rm "${{ steps.tags.outputs.sha_tag }}" \
            bash -c 'm68k-atari-mint-gcc --version | head -n1 && \
                     mac -? 2>&1 | head -n1 || true; \
                     aln -? 2>&1 | head -n1 || true; \
                     ls $JAGPATH/lib/lib | head'

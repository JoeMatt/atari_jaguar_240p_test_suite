name: Build & Publish Jaguar SDK image

on:
  push:
    branches: [main, master]
    paths:
      - 'docker/**'
      - '.github/workflows/sdk-image.yml'
  pull_request:
    paths:
      - 'docker/**'
      - '.github/workflows/sdk-image.yml'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push the built image to GHCR'
        required: false
        default: 'true'

concurrency:
  group: sdk-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/jaguar-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image name
        id: img
        run: echo "image=$(echo ${IMAGE} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          {
            echo "tags<<EOF"
            echo "${{ steps.img.outputs.image }}:latest"
            echo "${{ steps.img.outputs.image }}:sha-${SHORT_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build${{ github.event_name != 'pull_request' && ' & push' || '' }} SDK image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        if: github.event_name != 'pull_request'
        run: |
          docker pull ${{ steps.img.outputs.image }}:latest
          docker run --rm ${{ steps.img.outputs.image }}:latest \
            bash -c 'm68k-atari-mint-gcc --version | head -n1 && \
                     mac -? 2>&1 | head -n1 || true; \
                     aln -? 2>&1 | head -n1 || true; \
                     ls $JAGPATH/lib/lib | head'

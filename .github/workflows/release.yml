name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.2.3). Must already exist on the repo.'
        required: true
        type: string
      prerelease:
        description: 'Mark the release as a prerelease'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      SDK_IMAGE: ghcr.io/${{ github.repository_owner }}/jaguar-sdk:latest
      PROJECT: jag_240p_test_suite
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Resolve tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            TAG='${{ github.event.inputs.tag }}'
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}
          fetch-depth: 0

      - name: Lowercase image name
        run: echo "SDK_IMAGE=$(echo $SDK_IMAGE | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR (read)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull SDK image
        run: docker pull "$SDK_IMAGE"

      - name: Build release flavour, stage, then debug flavour
        run: |
          TAG='${{ steps.meta.outputs.tag }}'
          OUTDIR="dist/${PROJECT}-${TAG}"
          mkdir -p "$OUTDIR"

          docker run --rm -u "$(id -u):$(id -g)" \
            -v "$PWD:/work" -w /work "$SDK_IMAGE" \
            sh -c 'make clean && make && make rom'
          cp "${PROJECT}.cof" "$OUTDIR/${PROJECT}-${TAG}.cof"
          cp "${PROJECT}.bin" "$OUTDIR/${PROJECT}-${TAG}.bin"
          cp "${PROJECT}.rom" "$OUTDIR/${PROJECT}-${TAG}.rom"

          docker run --rm -u "$(id -u):$(id -g)" \
            -v "$PWD:/work" -w /work "$SDK_IMAGE" \
            sh -c 'make clean && make DEBUG=1 && make DEBUG=1 rom'
          cp "${PROJECT}-debug.cof" "$OUTDIR/${PROJECT}-${TAG}-debug.cof"
          cp "${PROJECT}-debug.bin" "$OUTDIR/${PROJECT}-${TAG}-debug.bin"
          cp "${PROJECT}-debug.rom" "$OUTDIR/${PROJECT}-${TAG}-debug.rom"

          ( cd "$OUTDIR" && sha256sum * > SHA256SUMS.txt )
          ls -lh "$OUTDIR"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.meta.outputs.tag }}
          path: dist/${{ env.PROJECT }}-${{ steps.meta.outputs.tag }}/*
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PROJECT: jag_240p_test_suite
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.tag }}
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.build.outputs.tag }}
          path: release/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: |
            release/${{ env.PROJECT }}-${{ needs.build.outputs.tag }}.cof
            release/${{ env.PROJECT }}-${{ needs.build.outputs.tag }}.bin
            release/${{ env.PROJECT }}-${{ needs.build.outputs.tag }}.rom
            release/${{ env.PROJECT }}-${{ needs.build.outputs.tag }}-debug.cof
            release/${{ env.PROJECT }}-${{ needs.build.outputs.tag }}-debug.bin
            release/${{ env.PROJECT }}-${{ needs.build.outputs.tag }}-debug.rom
            release/SHA256SUMS.txt
